[general]
# "debug", "info", "warning", "error", or "critical".
log_level = "info"
# Use a stable, random value of at least 32 characters. Do not reuse it elsewhere.
event_id_key = "replace-with-a-random-value-at-least-32-characters"

[journal]
# Select one local journal scope. Routes below select services within it.
scope = "system"

[mqtt]
host = "mqtt.example.net"
port = 8883
client_id = "lokimankeli-victron"
username = "lokimankeli"
password = "replace-me"
keepalive = 60
# Baseline for every publication: "ignore", "warn", "fail", or
# "require-sub". A jq output can override this with its own strictness.
strictness = "warn"
# Give the bridge one exact checkpoint topic shared by all routes.
state_topic = "lokimankeli/state"

[mqtt.tls]
enabled = true
# Omit ca_file to use the operating system trust store.
# The system service can provide these relative paths with LoadCredential.
# ca_file = "ca.pem"
# cert_file = "client.crt"
# key_file = "client.key"

[[route]]
unit = "victron-ble.service"
# Decode MESSAGE as JSON before jq. This is the default.
message_format = "json"
# Behavior when jq evaluation or publication descriptor validation fails for
# an entry: "ignore", "warn", or "fail".
filter_strictness = "warn"
# Each result defines one complete MQTT publication. This example splits
# connectivity data and measurements onto separate topics.
publish_filter = '''
{
  topic: "victron-ble/\(.address)/rssi",
  payload: {
    timestamp_ms: $timestamp_ms,
    event_id: $event_id,
    rssi: .rssi
  }
},
{
  topic: "victron-ble/\(.address)/data",
  strictness: "require-sub",
  payload: (
    .payload
    + {timestamp_ms: $timestamp_ms, event_id: $event_id}
  )
}
'''

[[route]]
unit = "environment.service"
message_format = "string"
filter_strictness = "warn"
publish_filter = '''
{
  topic: "environment/log",
  payload: {
    message: ., timestamp_ms: $timestamp_ms, event_id: $event_id
  }
}
'''
