[journal]
# Select exactly one local journal scope and service.
scope = "system"
unit = "victron-ble.service"

[mqtt]
host = "mqtt.example.net"
port = 8883
client_id = "lokimankeli-victron"
username = "lokimankeli"
password = "replace-me"
keepalive = 60

[mqtt.tls]
enabled = true
# Omit ca_file to use the operating system trust store.
# ca_file = "/etc/ssl/certs/private-ca.pem"
# cert_file = "/path/to/client.pem"
# key_file = "/path/to/client-key.pem"

[routing]
# Each result defines one complete MQTT publication. This example splits
# connectivity data and measurements onto separate topics.
publish_filter = '''
{
  topic: "victron-ble/\(.address)/rssi",
  payload: {
    timestamp: $timestamp,
    event_id: $event_id,
    rssi: .rssi
  }
},
{
  topic: "victron-ble/\(.address)/data",
  payload: (
    .payload
    + {timestamp: $timestamp, event_id: $event_id}
  )
}
'''

# Give every bridge instance its own exact checkpoint topic.
state_topic = "lokimankeli/state/victron"

[security]
# Use a stable, random value of at least 32 characters. Do not reuse it elsewhere.
event_id_key = "replace-with-a-random-value-at-least-32-characters"
